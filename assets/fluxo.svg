<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Fluxo: API REST, Spring Boot, Kafka, MongoDB e Redis, em Azure AKS">
<style>
.t{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}
.c{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8fd3f4}
.m{animation:go 5s linear infinite}
.m2{animation-delay:1.66s}.m3{animation-delay:3.33s}
@keyframes go{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(640px);opacity:0}}
</style>
<rect width="900" height="190" rx="14" fill="#010409"/>
<rect x="30" y="34" width="840" height="126" rx="12" fill="none" stroke="#30363d" stroke-dasharray="6 6"/>
<text x="46" y="26" class="c">Azure AKS</text>
<line x1="225" y1="97" x2="265" y2="97" stroke="#30363d" stroke-width="2"/><line x1="430" y1="97" x2="470" y2="97" stroke="#30363d" stroke-width="2"/><line x1="635" y1="97" x2="675" y2="97" stroke="#30363d" stroke-width="2"/>
<line x1="145" y1="145" x2="785" y2="145" stroke="#21262d" stroke-width="2"/>
<rect x="60" y="66" width="165" height="62" rx="10" fill="#0d1117" stroke="#2f9bd8"/><text x="142.5" y="103" class="t" text-anchor="middle">API REST</text>
<rect x="265" y="66" width="165" height="62" rx="10" fill="#0d1117" stroke="#2f9bd8"/><text x="347.5" y="103" class="t" text-anchor="middle">Spring Boot</text>
<rect x="470" y="66" width="165" height="62" rx="10" fill="#0d1117" stroke="#2f9bd8"/><text x="552.5" y="103" class="t" text-anchor="middle">Kafka</text>
<rect x="675" y="66" width="165" height="62" rx="10" fill="#0d1117" stroke="#2f9bd8"/><text x="757.5" y="103" class="t" text-anchor="middle">MongoDB + Redis</text>
<circle class="m" cx="145" cy="145" r="5" fill="#3fb950"/><circle class="m m2" cx="145" cy="145" r="5" fill="#3fb950"/><circle class="m m3" cx="145" cy="145" r="5" fill="#3fb950"/>
</svg>
